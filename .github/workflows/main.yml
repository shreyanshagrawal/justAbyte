name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/reusable-verify.yml
    permissions:
      contents: read

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Pack CLI package
        run: |
          cd packages/cli
          npm pack

      - name: Upload CLI package tarball
        uses: actions/upload-artifact@v4
        with:
          name: opencred-cli-tarball
          path: packages/cli/*.tgz
          retention-days: 14

  simulation-report:
    name: simulation-report
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run full simulation
        run: npm run simulation:gate

      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report-main
          path: |
            packages/simulation/output/simulation-report.md
            packages/simulation/output/simulation-report.json
          retention-days: 14
