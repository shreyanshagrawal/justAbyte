# persist-credentials explanation: why credentials are required for git push
name: Checkout With Comment Workflow

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run
        run: echo "test"

